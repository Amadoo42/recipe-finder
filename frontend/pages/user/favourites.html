{% load static %}
<!doctype html>
<html lang="en" data-auth-level="private">

<head>
    <meta charset="UTF-8" />
    <title>Favourites Recipe Finder</title>
    <script type="module" src="{% static 'shared/utils/favourites.js' %}"></script>
    <script type="module" src="{% static 'api/auth.js' %}"></script>
    <link href="{% static 'shared/css/main.css' %}" rel="stylesheet" />
    <link href="{% static 'shared/css/search.css' %}" rel="stylesheet" />
    <link href="{% static 'shared/css/cards.css' %}" rel="stylesheet" />
    <link href="{% static 'pages/admin/css/favorites-delete-button.css' %}" rel="stylesheet" />
</head>

<body>
    <nav></nav>

    <div class="TopSection">
        <div class="PageTitle cont">
            <h1 class="title">My Favourites</h1>
        </div>
        <div class="SearchGroup">
            <div id="search">
                <input type="text" placeholder="Search for a recipe..." />
                <span class="material-symbols-rounded" id="searchIcon">search</span>
            </div>
            <div class="BtnContainer" id="filterContainer">
                <button class="FilterBtn active" data-category="all">
                    <span class="BtnText">All</span>
                    <div class="IconContainer IconAll">
                        <img src="{% static 'shared/assets/plate_utensils_icon.svg' %}" alt="All" class="CustomIcon">
                        <span class="CountBadge" id="countAll">0</span>
                    </div>
                </button>

                <button class="FilterBtn" data-category="Main">
                    <span class="BtnText">Main Dish</span>
                    <div class="IconContainer IconMain">
                        <img src="{% static 'shared/assets/chicken_icon.svg' %}" alt="Main Dish" class="CustomIcon">
                        <span class="CountBadge" id="countMain">0</span>
                    </div>
                </button>

                <button class="FilterBtn" data-category="Appetizers">
                    <span class="BtnText">Appetizer</span>
                    <div class="IconContainer IconAppetizer">
                        <img src="{% static 'shared/assets/appetizer_icon.svg' %}" alt="Appetizer" class="CustomIcon">
                        <span class="CountBadge" id="countAppetizer">0</span>
                    </div>
                </button>

                <button class="FilterBtn" data-category="Dessert">
                    <span class="BtnText">Dessert</span>
                    <div class="IconContainer IconDessert">
                        <img src="{% static 'shared/assets/cake_icon.svg' %}" alt="Dessert" class="CustomIcon">
                        <span class="CountBadge" id="countDessert">0</span>
                    </div>
                </button>
            </div>
        </div>
        <div class="DecorationWrapper">
            <img src="{% static 'shared/assets/lolli.svg' %}" class="lollii">
        </div>
    </div>

    <img src="{% static 'shared/assets/pattern.svg' %}" class="pattern">

    <section id="main"></section><!-- put the grid id -->

    <section id="fav-empty" style="font-family:'Great Vibes' ;">
        <br>
        <h2 class="centered"
            style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: #AB9C8E;">
            No added favourites ｡･(つд`｡)･｡</h2>
    </section>
    <div class="herb-column left" id="herbLeft"></div>
    <div class="herb-column right" id="herbRight"></div>
</body>

</html>
