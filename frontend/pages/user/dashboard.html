{% load static %}
<!doctype html>
<html lang="en" data-auth-level="private">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <link href="{% static 'shared/css/main.css' %}" rel="stylesheet" />
    <link href="{% static 'shared/css/dashboard.css' %}" rel="stylesheet" />
    <script type="module" src="{% static 'api/auth.js' %}"></script>
</head>

<body>
    <nav></nav>

    <div class="Page">

        <div class="Container">

            <div class="DashboardLeft">
                <h1>Welcome!</h1>
                <h2 class="Username" data-firstName>User</h2>
                <p class="Description">Search, explore, and discover your next favourite dish.</p>
                
                <div class="Actions">
                    <a href="/user/search/">
                        <button class="Btn">Explore Recipes</button>
                    </a>
                    <a href="/user/favourites/">
                        <button class="Btn">View Favourites</button>
                    </a>
                </div>
            </div>

            <div class="DashboardRight">
                <img src="{% static 'shared/assets/italian pizza.jpg' %}" alt="italian pizza" />
            </div>

        </div>
    </div>
</body>

</html>
