{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/pages/classifier/css/classifier.css' %}">
    <title>Food Classifier</title>
</head>
<body>

    <header>
        <span class="logo">&#x25C6;</span>
        <h1>Food Classifier</h1>
    </header>

    <main>
        <form method="post" enctype="multipart/form-data" id="classifierForm">
            {% csrf_token %}

            <div class="field">
                <label for="imageURL">Image URL</label>
                <input type="text" id="imageURL" name="imageURL" placeholder="https://...">
            </div>

            <div class="field">
                <label>or Upload</label>
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="imageUpload" name="image" accept="image/*">
                    <p id="uploadLabel"><span>Choose file</span> or drag here</p>
                </div>
            </div>

            <img id="preview" src="#" alt="Preview">

            <button type="submit">Classify</button>

            {% if pred_class %}
            <div class="result">
                <p class="dish">{{ pred_class }}</p>
                <span class="badge">{{ confidence }}%</span>
            </div>
            {% endif %}
        </form>
    </main>

    <script src="{% static '/pages/classifier/js/classifier.js' %}" type="module"></script>
</body>
</html>
