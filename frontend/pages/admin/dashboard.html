{% load static %}
<!doctype html>
<html lang="en" data-auth-level="admin">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link href="{% static 'shared/css/main.css' %}" rel="stylesheet" />
    <link href="{% static 'shared/css/dashboard.css' %}" rel="stylesheet" />
    <script type="module" src="{% static 'api/auth.js' %}"></script>
</head>

<body>
    <nav></nav>

    <div class="Page">
        <main class="Container">
            <div class="DashboardLeft">
                <header>
                    <h1>Welcome!</h1>
                    <h2 class="Username" data-firstName>Admin</h2>
                    <p class="Description">Create, edit, and help others find their new favorite meal.</p>
                </header>

                <section class="Actions">
                    <a href="/admin/add/">
                        <button class="Btn">Add recipes</button>
                    </a>
                    <a href="/admin/explore/">
                        <button class="Btn">View recipes</button>
                    </a>
                </section>
            </div>

            <div class="DashboardRight">
                <img src="{% static 'shared/assets/nutella tiramesu.jpg' %}" alt="nutella tiramesu" />
            </div>
        </main>
    </div>
</body>

</html>
