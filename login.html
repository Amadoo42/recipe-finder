<!doctype html>
<html>
  <head>
    <meta name="author" content="Muhammed Esmail" />
    <meta charset="UTF-8" />
    <title>Log In — Recipe Finder</title>
    <script type="module" src="js/auth.js"></script>
  </head>

  <body>
    <nav>
      <a href="index.html">Home</a> | <a href="login.html">Login</a> |
      <a href="signup.html">Sign Up</a>
    </nav>
    <hr />

    <!-- H1 header -->

    <h1>Recipe Finder</h1>
    <hr />

    <!-- Sign in -->
    <h2>Sign In</h2>

    <form name="loginUserForm" id="loginForm">
      <!-- Credentials -->
      <fieldset>
        <legend>Your Credentials</legend>

        <br />

        <label> Username: </label>
        <br />
        <input
          type="text"
          id="user_name"
          name="user_name"
          placeholder="eg. Esmail0"
          required
        />
        <br /><br />

        <br />

        <label> Password </label><br />
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          placeholder="At least 8 characters"
          required
        />
        <br /><br />
      </fieldset>

      <br />
      <!-- Sign in + Clear Form button -->
      <input type="submit" value="Sign In" />
      <input type="reset" value="Clear" />
    </form>
    <hr />
    <!-- Footer -->
    <p>Don't have an account? <a href="signup.html">Create one here</a></p>
    <script type="module" src="js/login-handler.js"></script>
  </body>
</html>
