<!doctype html>
<html>
    <head>
        <meta name="author" content="Muhammed Esmail" />
        <meta charset="UTF-8" />
        <title>Log In — Recipe Finder</title>
        <script type="module" src="js/auth.js"></script>
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/auth-style.css" />
    </head>

    <body>
        <nav>
            <a href="index.html">Home</a> | <a href="login.html">Login</a> |
            <a href="signup.html">Sign Up</a>
        </nav>
        <hr />

        <!-- H1 header -->

        <div id="titleContainer">
            <h1>Recipe Finder</h1>
        </div>
        <hr />

        <!-- Sign in -->
        <div id="mainCard">
            <div id="cardTitleContainer">
                <h2 id="cardTitle">Sign In</h2>
            </div>

            <form name="loginUserForm" id="loginForm">
                <!-- Credentials -->
                <fieldset>
                    <legend>Your Credentials</legend>

                    <br />

                    <label> Username: </label>
                    <br />
                    <input
                        type="text"
                        id="user_name"
                        name="user_name"
                        placeholder="eg. Esmail0"
                        required
                    />
                    <br /><br />

                    <br />

                    <label> Password </label><br />
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required
                    />
                    <br /><br />
                </fieldset>

                <br />

                <!-- Sign in + Clear Form button -->
                <div id="btns">
                    <input type="submit" value="Sign In" id="submit" />
                    <input type="reset" value="Clear" id="clear" />
                </div>
            </form>
        </div>
        <hr />
        <!-- Footer -->
        <div id="footer">
            <p>
                Don't have an account? <a href="signup.html">Create one here</a>
            </p>
        </div>
        <script type="module" src="js/login-handler.js"></script>
    </body>
</html>
