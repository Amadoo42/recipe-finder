<!doctype html>
<html lang="en" data-auth-level="admin">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/main.css">
  <link href="../css/cards.css" rel="stylesheet" />
  <link href="../css/search.css" rel="stylesheet" />
  <link href="../css/admin-buttons.css" rel="stylesheet" />
  <script type="module" src="../js/auth.js"></script>
  <title>All recipes</title>
</head>

<body>
  <nav></nav>

  <div class="TopSection">
    <div class="cont">
      <h1 class="title">Available Recipes</h1>
    </div>

    <header class="SearchGroup">
      <div id="search">
        <input type="text" placeholder="Search for a recipe..." />
        <span class="material-symbols-rounded" id="searchIcon">search</span>
      </div>
      <div class="BtnContainer" id="filters">
        <button class="FilterBtn active" data-category="all">
          <span class="BtnText">All</span>
          <div class="IconContainer IconAll">
            <img src="../assets/plate_utensils_icon.svg" alt="All" class="CustomIcon">
          </div>
        </button>

        <button class="FilterBtn" data-category="Main">
          <span class="BtnText">Main Dish</span>
          <div class="IconContainer IconMain">
            <img src="../assets/chicken_icon.svg" alt="Main Dish" class="CustomIcon">
          </div>
        </button>

        <button class="FilterBtn" data-category="Appetizers">
          <span class="BtnText">Appetizer</span>
          <div class="IconContainer IconAppetizer">
            <img src="../assets/appetizer_icon.svg" alt="Appetizer" class="CustomIcon">
          </div>
        </button>

        <button class="FilterBtn" data-category="Dessert">
          <span class="BtnText">Dessert</span>
          <div class="IconContainer IconDessert">
            <img src="../assets/cake_icon.svg" alt="Dessert" class="CustomIcon">
          </div>
        </button>
      </div>
    </header>
    <div class="DecorationWrapper">
      <img src="../assets/mala7a.svg" class="mala7a">
    </div>
  </div>

  <img src="../assets/pattern.svg" class="pattern">

  <main id="main">
    <article>
      <img src="" />
      <p>Recipe Name</p>
      <p>Short description of the recipe...</p>
      <div>
        <button>Edit</button>
        <button>Delete</button>
      </div>
    </article>
  </main>

  <div class="herb-column left" id="herbLeft"></div>
  <div class="herb-column right" id="herbRight"></div>

  <script type="module" src="../js/handlers/admin-view.js"></script>
</body>

</html>
