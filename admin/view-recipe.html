<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All recipes</title>
</head>
<body>
    <nav>
        <a href="dashboard.html">Admin Dashboard</a> | 
        <a href="add-recipe.html">Add New Recipe</a> | 
        <a href="view-recipe.html">View Recipes</a> | 
        <a href="../index.html">Logout</a>
    </nav>
    <hr>
    <header>
        <h1>Available Recipes</h1>
        <div>
            <input type = "text" placeholder="Search for a recipe...">
            <button>Search</button>
        </div>
    </header>
    <section>
        <h2>Filter:</h2>
        <label>Course:</label>
        <select>
            <option>All</option>
            <option>Appetizer</option>
            <option>Main</option>
            <option>Dessert</option>
        </select>
        <button>Apply Filters</button>
    </section>
    <hr>
    <main>
        <article>
            <p>Recipe Name</p>
            <p>Short description of the recipe...</p>
            <div>
                <button>Edit</button>
                <button>Delete</button>
            </div>
        </article>
    </main>
</body>
</html>
