<!doctype html>
<html lang="en" data-auth-level="admin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
    <link rel = "stylesheet" href = "../css/main.css">
    <link href="../css/cards.css" rel="stylesheet" />
    <link href="../css/search.css" rel="stylesheet" />
    <link href="../css/admin-buttons.css" rel="stylesheet" />
    <script type="module" src="../js/auth.js"></script>
    <title>All recipes</title>
  </head>

  <body>
    <nav></nav>

    <header id="navigation">
      <div id="search">
        <input type="text" placeholder="Search for a recipe..." />
        <span class="material-symbols-outlined" id="searchIcon">search</span>
      </div>
      <div id="filters">
        <button data-category="All">All</button>
        <button data-category="Main">Main Dish</button>
        <button data-category="Appetizers">Appetizers</button>
        <button data-category="Dessert">Dessert</button>
      </div>
    </header>


    <main id="main">
      <article>
        <img src="" />
        <p>Recipe Name</p>
        <p>Short description of the recipe...</p>
        <div>
          <button>Edit</button>
          <button>Delete</button>
        </div>
      </article>
    </main>

    <script type="module" src="../js/handlers/admin-view.js"></script>
  </body>
</html>
