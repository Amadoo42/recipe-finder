<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/add-recipe.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>Add Recipe</title>
</head>
<body>
    
    <nav>
        <a href="dashboard.html">Admin Dashboard</a> | 
        <a href="add-recipe.html">Add New Recipe</a> |
        <a href="view-recipe.html">View Recipes</a> | 
        <a href="../index.html">Logout</a>
    </nav>
    <div class="TitleContainer">
        <h1 class="Title">
            Recipe Finder
        </h1>
    </div>

    <div class="MainDiv">
        <p class="AddRecipeHeader" style="text-align: left;" id="recipe">Add a New Recipe</p>

        <hr>

        <form>
    
            <h2 class="GreatVibesRegular" for="recipe">Recipe Details</h2>

            <div class="SecondaryDiv">

                <div>
                    <label class="GreatVibesRegular" for="recipe-name">Recipe Name</label><br>
                    <input type="text" class="DataField" name="recipe-name" placeholder="Enter recipe name" id="recipeName"><br>
                </div>
        
                <div>
                    <label class="GreatVibesRegular" for="course">Course</label><br>
                    <select class="DataField" name="course" id="course">
                        <option>Appetizers</option>
                        <option>Main</option>
                        <option>Dessert</option>
                    </select><br>
                </div>
            </div>

            <div id="descriptionContainer">
                <label class="GreatVibesRegular" for="description">Description</label><br>
                <textarea class="DataField" name="description" rows="6" cols="40" placeholder="Write a short description of the recipe..."  id="description"></textarea><br>
                <hr style="display: none;">
            </div>
    
            <hr>
    
            <h2 class="GreatVibesRegular" for="ingredients">Ingredients</h2>

            <div class="SecondaryDiv">
                <div>
                    <label class="GreatVibesRegular" for="ingredient-name">Ingredient Name</label><br>
                    <input class="DataField" type="text" id="ingredientName" name="ingredient-name" placeholder="e.g. Sugar">
                </div>

                <div>
                    <label class="GreatVibesRegular" for="ingredient-name">Ingredient Quantity</label><br>
                    <input class="DataField" type="number" id="quantity" name="quantity" placeholder="Amount" min="1">
                </div>

                <div>
                    <label class="GreatVibesRegular" for="unit">Unit</label><br>
                    <select class="DataField" name="unit" id="unit" onchange="handleOtherUnit()">
                        <option>Cups</option>
                        <option>Spoons</option>
                        <option>Pieces</option>
                        <option id="otherUnit">Other</option>
                    </select>
                </div>
                
                <div>
                    <button onclick="addNewIngredient()" type="button" id="addIngredient">Add</button>
                </div>
        
            </div>
        </form>
        <p id="quantityErrorMessage" class="ErrorMessage">Quantity must be a valid number greater than 0.</p>
        <p id="ingredientNameErrorMessage" class="ErrorMessage">Ingredient name cannot include numbers or special characters</p>

        <div id="customUnitCotainer">
            <div id="customUnitPrompt">
                <label class="GreatVibesRegular">Enter a custom unit</label>
                <input class="DataField" type="text" name="custom-unit">
                <div id="customUnitSubmitContainer">
                    <button id="cancelCustomUnit" onclick="cancelOtherUnit()">Cancel</button>
                    <button id="addCustomUnit" onclick="addOtherUnit()">Add Custom Unit</button>
                </div>
            </div>
        </div>
    
        <ul id="ingredientList">
        </ul>
        
        <div id="addRecipeButtonContainer">
            <button type="button" id="addRecipe" onclick="createRecipeObject()">Add Recipe</button>
        </div>
    </div>
    <script src="../js/add-recipe.js"></script>
    <script src="../js/edit-recipe.js"></script>
</body>
</html>
