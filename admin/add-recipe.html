<!DOCTYPE html>
<html lang="en" data-auth-level="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/add-recipe.css">
    <script type="module" src="../js/auth.js"></script> 
    <title>Add Recipe</title>
</head>
<body>
    <nav></nav>
    <hr>

    <h1 class="title">
        Recipe Finder
    </h1>

    <div class="main-div">
        <p class="add-recipe-header" style="text-align: left;" id="recipe">Add a New Recipe</p>

        <form>
    
            <h2 class="great-vibes-regular" for="recipe">Recipe Details</h2>

            <div class="secondary-div">

                <div>
                    <label class="great-vibes-regular" for="recipe-name">Recipe Name</label><br>
                    <input type="text" class="data-field" name="recipe-name" placeholder="Enter recipe name" id="recipe-name"><br>
                </div>
        
                <div>
                    <label class="great-vibes-regular" for="course">Course</label><br>
                    <select class="data-field" name="course" id="course">
                        <option>Appetizers</option>
                        <option>Main</option>
                        <option>Dessert</option>
                    </select><br>
                </div>
            </div>

            <div>
                <label class="great-vibes-regular" for="description">Description</label><br>
                <textarea class="data-field" name="description" rows="4" cols="40" placeholder="Write a short description of the recipe..."  id="description"></textarea><br>
            </div>
    
    
            <hr>
    
            <h2 class="great-vibes-regular" for="ingredients">Ingredients</h2>

            <div class="secondary-div">
                <div>
                    <label class="great-vibes-regular" for="ingredient-name">Ingredient Name</label><br>
                    <input class="data-field" type="text" id="ingredient-name" name="ingredient-name" placeholder="e.g. Sugar">
                </div>

                <div>
                    <label class="great-vibes-regular" for="ingredient-name">Ingredient Quantity</label><br>
                    <input class="data-field" type="number" id="quantity" name="quantity" placeholder="1" min="1">
                </div>

                <div>
                    <label class="great-vibes-regular" for="unit">Unit</label><br>
                    <select class="data-field" name="unit" id="unit">
                        <option>Cup</option>
                        <option>Spoon</option>
                        <option>Piece</option>
                    </select>
                </div>
                
                <div>
                    <button onclick="addIngredient()" type="button" id="add-ingredient">+</button>
                </div>
        
            </div>
        </form>
        <p id="error-message">Quantity must be a valid number greater than 0.</p>
    
        <hr>
    
    <button type="button" id="add-recipe">Add Recipe</button>
        <h2 class="great-vibes-regular">Ingredients List</h3>
        <ul id="ingredient-list">
        </ul>
    
        <hr>
        
        <button type="button" id="add-recipe" onclick="createRecipeObject()">Add Recipe</button>
    </div>
    <script src="../js/handlers/add-recipe.js"></script>
    <script src="../js/handlers/edit-recipe.js"></script>
</body>
</html>
