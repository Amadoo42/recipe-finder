<!doctype html>
<html lang="en" data-auth-level="private">
    <head>
        <meta charset="UTF-8" />
        <title>Recipe Details</title>
        <link href="../css/main.css" rel="stylesheet" />
        <link href="../css/favourite-button.css" rel="stylesheet" />
        <link href="../css/recipe-details.css" rel="stylesheet"  />
        <script type="module" src="../js/auth.js"></script>
    </head>
    <body>
        <nav></nav>

        <main class="RecipeDetailsContainer">
            <h1 id="recipeName">Recipe Name</h1>

            <div class="HeroImageContainer">
                <img src="../assets/recipeImage.png" alt="Main Dish" id="recipeImage">

                <button id="favBtn" class="FavBtn">
                    <span class="material-symbols-rounded">favorite</span>
                </button>
            </div>
            
            <h3 id="course">Main Dish</h3>
            <p id="recipeDescription"></p>
            
            <div class="IngredientsSection">
                <h2>Ingredients</h2>
                <ol id="ingredientList">
                    <li>Ingredient 1</li>
                    <li>Ingredient 2</li>
                    <li>Ingredient 3</li>
                </ol>
            </div>
        </main>        
        
        <script type="module" src="../js/handlers/recipe-details.js"></script>
    </body>
</html>
