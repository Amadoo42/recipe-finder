<!doctype html>
<html lang="en" data-auth-level="private">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Explore Recipes</title>
        <link href="../css/main.css" rel="stylesheet" />
        <link href="../css/search.css" rel="stylesheet" />
        <link href="../css/cards.css" rel="stylesheet" />
        <link href="../css/favourite-button.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
        <script type="module" src="../js/auth.js"></script>
    </head>
    <body>
        <nav></nav>

        <div id="navigation">
            <div id="search">
                <input type="text" placeholder="Search for a recipe..." />
                <span class="material-symbols-outlined" id="searchIcon">search</span>
            </div>
            <div id="filters">
                <button data-category="All">All</button>
                <button data-category="Main">Main Dish</button>
                <button data-category="Appetizers">Appetizers</button>
                <button data-category="Dessert">Dessert</button>
            </div>
        </div>
        

        <main id="main">
            <article>
                <p>Recipe Name</p>
                <p>Short description of the recipe...</p>
                <a href="recipe_details.html">
                    <button>View Details</button>
                </a>
                <br/>
                <button>Add to Favourites</button>
            </article>
        </main>
        <script type="module" src="../js/handlers/user-view.js"></script>
    </body>
</html>
