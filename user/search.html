<!doctype html>
<html lang="en" data-auth-level="private">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Explore Recipes</title>
        <link href="../css/main.css" rel="stylesheet" />
        <link href="../css/search.css" rel="stylesheet" />
        <link href="/css/cards.css" rel="stylesheet" />
        <link href="/css/favourite-button.css" rel="stylesheet" />

        <script type="module" src="../js/auth.js"></script>
    </head>
    <body>
        <nav></nav>

        <div id="search">
            <input type="text" placeholder="Search for a recipe..." />
        </div>
        <div id="filters">
            <button data-category="All">All</button>
            <button data-category="Main">Main Dish</button>
            <button data-category="Appetizers">Appetizers</button>
            <button data-category="Dessert">Dessert</button>
        </div>

        <main id="main">
            <article>
                <p>Recipe Name</p>
                <p>Short description of the recipe...</p>
                <a href="recipe_details.html">
                    <button>View Details</button>
                </a>
                <br/>
                <button>Add to Favourites</button>
            </article>
        </main>
        <script type="module" src="../js/handlers/user-view.js"></script>

</html>
