<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Recipes</title>
</head>
<body>
    <nav>
        <a href="dashboard.html">User Dashboard</a> |
        <a href="search.html">Search & Browse Recipes</a> | 
        <a href="favourites.html">My Favourites</a> | 
        <a href="../index.html">Logout</a> 
    </nav>
    <hr>

    <div id="search">
        <h1>Search for Recipes</h1>
        <input type="text" id="search-bar" name="search-bar" placeholder="Search for recipes...">
        <button type="button" id="search-button">Search</button>
    </div>
    <div id="filters">
        <h2>Filter:</h2>
        <label for="course-filter">Course:</label>
        <select name="course-filter" id="course-filter">
            <option value="">All</option>
            <option value="appetizer">Appetizer</option>
            <option value="main">Main</option>
            <option value="dessert">Dessert</option>
        </select>
        <button type="button" id="apply-filters">Apply Filters</button>
    </div>
    <hr>
    <div id="results">
        <h2>Search Results:</h2>
        <article>
            <h3>Recipe Name</h3>
            <p>Short description of the recipe...</p>
            <a href="recipe_details.html">
                <button type="button">View Details</button>
            </a>
            <br>
            <button type="button">Add to Favourites</button>
        </article>
    </div>
</body>
</html>
